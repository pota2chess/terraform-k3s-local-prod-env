name: CI Pipeline

on:
  push:
    branches: [main]

env:
  IMAGE_PREFIX: pota2chess

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set image tag
      id: meta
      run: echo "tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

    - name: Login in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Set up Docker Build
      uses: docker/setup-buildx-action@v3

    - name: Build and Push Vote
      run: |
        IMG=${{ env.IMAGE_PREFIX }}/examplevotingapp_vote
        TAG=${{ steps.meta.outputs.tag }}
        docker build -t $IMG:$TAG -t $IMG:latest ./src/vote/
        docker push $IMG:$TAG
        docker push $IMG:latest

    - name: Build and Push Worker
      run: |
        IMG=${{ env.IMAGE_PREFIX }}/examplevotingapp_worker
        TAG=${{ steps.meta.outputs.tag }}
        docker build -t $IMG:$TAG -t $IMG:latest ./src/worker/
        docker push $IMG:$TAG
        docker push $IMG:latest

    - name: Build and Push Result
      run: |
        IMG=${{ env.IMAGE_PREFIX }}/examplevotingapp_result
        TAG=${{ steps.meta.outputs.tag }}
        docker build -t $IMG:$TAG -t $IMG:latest ./src/result/
        docker push $IMG:$TAG
        docker push $IMG:latest

  deploy-and-test:
    runs-on: ubuntu-latest
    needs: build-and-push
    container:
      image: alpine/helm:latest

    steps:
    - name: Install Node.js
      run: |
        apk add nodejs npm
        
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup KUBECONFIG
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config
        chmod 600 $HOME/.kube/config

    - name: Deploy with Helm
      run: |
        TAG=${{ needs.build-and-push.outputs.image_tag }}
        helm upgrade --install my-app ./kubernetes/helm/my-app \
        --namespace my-app \
        --create-namespace \
        --set vote.image.tag=$TAG \
        --set worker.image.tag=$TAG \
        --set result.image.tag=$TAG \
        --wait

    - name: Smoke test
      id: smoke
      continue-on-error: true
      run: |
        sleep 10
        curl -f -H "Host: vote.local" http://k3s:8080
        curl -H "Host: result.local" http://k3s:8080

    - name: Rollback on failure
      if: steps.smoke.outcome == 'failure'
      run: |
        helm rollback my-app -n my-app
        exit 1
