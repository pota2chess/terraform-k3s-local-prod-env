replicaCount: 1

applications:
  - name: vote
    service: true
    ingress: true
    image: pota2chess/examplevotingapp_vote
    tag: latest
    port: 8080
    targetPort: 80
    host: vote.local

  - name: redis
    service: true
    ingress: false
    image: redis
    tag: alpine
    port: 6379
    targetPort: 6379
    volumeMounts:
    - mountPath: /data
      name: redis-data
    volumes:
    - name: redis-data
      emptyDir: {}

  - name: worker
    service: false
    ingress: false
    image: pota2chess/examplevotingapp_worker
    tag: latest
    depends_on:
    - name: db
      port: 5432
    - name: redis
      port: 6379

  - name: db
    service: true
    ingress: false
    image: postgres
    tag: 15-alpine
    port: 5432
    targetPort: 5432
    env:
    - name: POSTGRES_USER
      value: posgtres
    - name: POSTGRES_PASSWORD
      value: posgtres
    volumeMounts:
    - mountPath: /var/lib/postgresql/data
      name: db-data
    volumes:
    - name: db-data
      emptyDir: {}

  - name: result
    service: true
    ingress: true
    image: pota2chess/examplevotingapp_result
    tag: latest
    port: 8081
    targetPort: 80
    host: result.local
